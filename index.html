<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnight at Mustang Memorial</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230C1B2E'/%3E%3Cpath d='M50 14a30 30 0 0 0-30 30c0 10 5 17 11 21v13h38V65c6-4 11-11 11-21a30 30 0 0 0-30-30z' fill='%23F1EBDD'/%3E%3Ccircle cx='39' cy='46' r='8' fill='%230C1B2E'/%3E%3Ccircle cx='61' cy='46' r='8' fill='%230C1B2E'/%3E%3Ccircle cx='39' cy='47' r='3' fill='%237BAFD4'/%3E%3Ccircle cx='61' cy='47' r='3' fill='%237BAFD4'/%3E%3Cpath d='M42 78v8M50 78v8M58 78v8' stroke='%230C1B2E' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF4FB; --surface:#FFFFFF; --surface-2:#DCEBF6; --ink:#0E2238; --muted:#46627E; --line:#B6D0E5;
  --accent:#2F7DB8; --accent-ink:#FFFFFF; --accent-soft:rgba(75,156,211,.16); --sky:#7FC4EA;
  --good:#1E7A55; --good-soft:rgba(30,122,85,.12); --bad:#B0283F; --bad-soft:rgba(176,40,63,.10); --warn:#A3560A;
  --fog:rgba(123,175,212,.28); --tile:#D6E7F4; --bat:#1B3552;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1B2E; --surface:#12253D; --surface-2:#1A3150; --ink:#F3F8FD; --muted:#A6C2DC; --line:#2A496D;
    --accent:#7BAFD4; --accent-ink:#0A1828; --accent-soft:rgba(123,175,212,.16); --sky:#A7D8F0;
    --good:#86E2B9; --good-soft:rgba(134,226,185,.12); --bad:#FF9FB0; --bad-soft:rgba(255,159,176,.12); --warn:#F2C46D;
    --fog:rgba(123,175,212,.11); --tile:#1A3150; --bat:#4F7BA6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1B2E; --surface:#12253D; --surface-2:#1A3150; --ink:#F3F8FD; --muted:#A6C2DC; --line:#2A496D;
  --accent:#7BAFD4; --accent-ink:#0A1828; --accent-soft:rgba(123,175,212,.16); --sky:#A7D8F0;
  --good:#86E2B9; --good-soft:rgba(134,226,185,.12); --bad:#FF9FB0; --bad-soft:rgba(255,159,176,.12); --warn:#F2C46D;
  --fog:rgba(123,175,212,.11); --tile:#1A3150; --bat:#4F7BA6;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:1.125rem;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:radial-gradient(40% 30% at 18% 28%,var(--fog),transparent 70%),radial-gradient(38% 28% at 82% 72%,var(--fog),transparent 70%),radial-gradient(30% 22% at 60% 10%,var(--fog),transparent 70%);
  animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(6%,-5%,0)}}
#app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:16px clamp(14px,3vw,28px) 150px}
h1,h2,h3{font-family:var(--fd);font-weight:var(--fdw);letter-spacing:.01em}
h2{font-size:clamp(2rem,4.4vw,2.8rem);line-height:1.02;margin:0}
p{margin:0 0 .8em}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ambient creatures */
.bats{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bat{position:absolute;left:0;top:0;width:46px;fill:var(--bat);opacity:0}
.bat .wing{transform-box:fill-box;transform-origin:center;animation:flap .22s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.45)}}
.b1{animation:fly1 22s linear infinite 1s}
.b2{width:34px;animation:fly2 29s linear infinite 9s}
.b3{width:28px;animation:fly1 35s linear infinite 18s}
@keyframes fly1{0%{transform:translate(-8vw,16vh);opacity:.85}20%{transform:translate(25vw,8vh)}40%{transform:translate(60vw,20vh)}55%{transform:translate(108vw,6vh);opacity:.85}56%,100%{transform:translate(108vw,6vh);opacity:0}}
@keyframes fly2{0%{transform:translate(108vw,60vh);opacity:.7}25%{transform:translate(70vw,48vh)}45%{transform:translate(30vw,58vh)}60%{transform:translate(-8vw,42vh);opacity:.7}61%,100%{transform:translate(-8vw,42vh);opacity:0}}

.spider{position:fixed;top:0;left:76%;z-index:6;width:40px;transform:translateY(-140px);animation:spiderdrop 28s ease-in-out infinite 7s;pointer-events:none}
.spider::before{content:"";position:absolute;left:50%;bottom:30px;width:1.5px;height:600px;background:linear-gradient(to top,rgba(167,216,240,.8),rgba(167,216,240,.15));transform:translateX(-50%)}
.spider svg{display:block;width:40px;pointer-events:auto;cursor:pointer;animation:wiggle 1.2s ease-in-out infinite}
.spider.flee{animation:flee .9s ease-in forwards}
@keyframes spiderdrop{0%,28%{transform:translateY(-140px)}36%{transform:translateY(150px)}42%{transform:translateY(135px)}50%{transform:translateY(155px)}58%{transform:translateY(140px)}66%,100%{transform:translateY(-140px)}}
@keyframes wiggle{50%{transform:rotate(6deg)}}
@keyframes flee{from{transform:translateY(140px)}to{transform:translateY(-200px)}}

.lightning{position:fixed;inset:0;pointer-events:none;z-index:4;background:#E8F6FF;opacity:0;animation:lightning 19s linear infinite 4s}
@keyframes lightning{0%,90%,100%{opacity:0}90.5%{opacity:.35}91%{opacity:0}91.6%{opacity:.25}92.4%{opacity:0}}

/* Dr. Bones */
.bones{position:fixed;right:14px;bottom:12px;z-index:8;display:none;align-items:flex-end;gap:8px;pointer-events:none}
.bones-btn{pointer-events:auto}
.bones.on{display:flex}
.bones-btn{width:86px;height:104px;border:0;background:none;padding:0;cursor:pointer;animation:hover 3.6s ease-in-out infinite}
.bones-btn svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
@keyframes hover{50%{transform:translateY(-6px) rotate(-2deg)}}
.bones .jaw{transform-box:fill-box;transform-origin:top center}
.bones.talk .jaw{animation:chatter .13s ease-in-out 10 alternate}
@keyframes chatter{to{transform:translateY(5px) rotate(2deg)}}
.bones.sad .bones-btn{animation:shakehead .6s ease-in-out}
@keyframes shakehead{20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.bones .pupil{animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bones .pupil{transform-box:fill-box;transform-origin:center}
.bones.happy .pupil{fill:#FFFFFF}
.bubble{max-width:250px;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:1rem;line-height:1.35;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);opacity:0;transform:translateY(8px) scale(.96);transition:opacity .2s,transform .2s;pointer-events:none;margin-bottom:58px}
.bubble.show{opacity:1;transform:none}
@media (max-width:620px){.bones-btn{width:62px;height:76px}.bubble{max-width:190px;font-size:.95rem;margin-bottom:44px}}

/* toasts + fx */
.toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:30;display:grid;gap:8px;width:min(92vw,380px);pointer-events:none}
.toast{display:flex;gap:12px;align-items:center;background:#0A1828;color:#FFFFFF;border:2px solid #7BAFD4;border-radius:14px;padding:10px 14px;box-shadow:0 0 22px rgba(123,175,212,.45);animation:toastin .45s cubic-bezier(.2,1.4,.4,1),toastout .4s ease-in 3.1s forwards}
.toast .te{font-size:1.9rem;line-height:1}
.toast b{display:block;font-family:var(--fd);font-weight:400;font-size:1.3rem;line-height:1.1;color:#A7D8F0}
.toast span{font-size:.95rem;color:#D9E9F5}
@keyframes toastin{from{transform:translateY(-30px) scale(.8);opacity:0}}
@keyframes toastout{to{transform:translateY(-20px);opacity:0}}
.floatpts{position:fixed;z-index:31;pointer-events:none;font:800 1.4rem var(--fb);color:#4B9CD3;text-shadow:0 0 8px rgba(167,216,240,.9),0 2px 0 #fff;animation:floatup 1.2s ease-out forwards}
@keyframes floatup{to{transform:translateY(-70px) scale(1.2);opacity:0}}
.spark{position:fixed;z-index:31;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(760deg)}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font:700 1.05rem/1.1 var(--fb);padding:13px 24px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:transform .12s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.96)}
.btn.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:9px 16px;font-size:.98rem}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chip{font:500 .98rem var(--fb);padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:26px}
.brand{font-family:var(--fd);font-size:clamp(1.15rem,2.2vw,1.45rem);line-height:1.1;min-width:0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud{display:flex;gap:6px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface);border:1.5px solid var(--accent);border-radius:999px;padding:5px 12px}
.streak{display:inline-block;color:#E8833A;animation:flame .5s ease-in-out infinite alternate}
@keyframes flame{to{transform:scale(1.18) rotate(-6deg)}}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);padding:0 4px}
.clock-p{display:none;margin-left:6px;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:0 7px}
.clock.paused .clock-p{display:inline-block}
.clock.late{color:var(--warn);font-weight:800}
.clock.late .clock-p{border-color:var(--warn)}
.lvchip.capped{background:var(--warn) !important;color:var(--bg) !important}
.midflick{position:fixed;inset:0;z-index:60;pointer-events:none;background:#020810;opacity:0;animation:midflick 2.4s linear forwards}
@keyframes midflick{0%{opacity:0}8%{opacity:.75}12%{opacity:.1}20%{opacity:.8}26%{opacity:.2}34%{opacity:.85}60%{opacity:.4}100%{opacity:0}}
.clock.paused [data-clock],.clock.paused .candle{opacity:.55}
.clock.paused .candle,.clock.paused .candle .cflame{animation-play-state:paused}
.candle{display:inline-block;animation:candle 1.4s ease-in-out infinite alternate}
@keyframes candle{50%{transform:skewX(-6deg) scaleY(.94)}to{transform:skewX(4deg)}}

/* title */
.title{position:relative;max-width:840px;margin:4vh auto 0}
.moon{position:absolute;right:-2%;top:-4%;width:clamp(120px,22vw,210px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#FFFFFF 0%,#D9EEF9 38%,#A7D8F0 70%,#7BAFD4 100%);
  box-shadow:0 0 60px 18px rgba(167,216,240,.35);opacity:.9;animation:moonglow 6s ease-in-out infinite alternate;pointer-events:none}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 64% 60%,rgba(75,156,211,.35) 0 12%,transparent 13%),radial-gradient(circle at 35% 70%,rgba(75,156,211,.25) 0 8%,transparent 9%),radial-gradient(circle at 70% 30%,rgba(75,156,211,.22) 0 6%,transparent 7%)}
@keyframes moonglow{to{box-shadow:0 0 80px 28px rgba(167,216,240,.5)}}
.kicker{color:var(--accent);font-weight:700;margin:0}
h1{position:relative;font-size:clamp(2.8rem,8vw,5.2rem);line-height:.95;margin:.12em 0 .35em;max-width:12ch}
h1.flick{animation:flicker 2.6s ease-out 1}
@keyframes flicker{0%{opacity:0}7%{opacity:1}9%{opacity:.25}12%{opacity:1}38%{opacity:.8}40%{opacity:1}100%{opacity:1}}
.lede{font-size:1.2rem;position:relative}
.how{color:var(--muted)}
.field{display:grid;gap:6px;margin:24px 0 8px;max-width:460px}
.field label,.flabel{font-weight:700}
.avpick{display:flex;flex-wrap:wrap;gap:6px}
.avbtn{width:50px;height:50px;padding:0;border-radius:50%;border:3px solid transparent;background:none;cursor:pointer;transition:transform .12s}
.avbtn:hover{transform:translateY(-2px)}
.avbtn.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.avbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.av{display:block;border-radius:50%;overflow:hidden}
.avbtn .av{width:100%;height:100%}
.hud-av{width:1.7em;height:1.7em;margin:-4px 0 -4px -6px}
.stat-av{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.2em}
.p-who{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.p-who .p-name{margin:0}
.p-av{width:clamp(72px,11vw,104px);height:clamp(72px,11vw,104px);flex:none;border:3px solid #A7D8F0;box-shadow:0 0 18px rgba(123,175,212,.6)}
input[type=text],textarea{font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
textarea{font-size:.85rem;min-height:84px;font-family:ui-monospace,Menlo,Consolas,monospace}
.pick-head{font-size:1.9rem;margin:26px 0 4px}
.pick-sub{color:var(--muted);margin:0 0 12px}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.case{display:grid;gap:4px;align-content:start;text-align:left;padding:16px 18px;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.case:hover{border-color:var(--accent);transform:translateY(-3px) rotate(-.5deg)}
.case.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}
.case-emoji{font-size:1.8rem;line-height:1;display:inline-block}
.case:hover .case-emoji,.case.sel .case-emoji{animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-5px) rotate(8deg)}}
.case-title{font:var(--fdw) 1.4rem/1.08 var(--fd);margin-top:4px}
.case-who{color:var(--muted);font-size:1rem}
.warn{color:var(--bad);font-weight:500;margin:10px 0 0}

/* hallway */
.stage{position:relative}
.intro-text{color:var(--muted)}
.hall-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap}
.hall-head > div:first-child{flex:1 1 360px}
.hall-head h2{animation:flicker 2.2s ease-out 1}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-top:24px;position:relative;z-index:1}
.door{position:relative;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:left;padding:112px 32px 22px 20px;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:130px 130px 12px 12px;cursor:pointer;overflow:hidden;transition:transform .15s}
.door::before{content:"";position:absolute;left:50%;top:34px;width:58px;height:58px;transform:translateX(-50%);border-radius:50%;border:2px solid var(--line);background:var(--surface-2)}
.door::after{content:"";position:absolute;right:13px;top:58%;width:10px;height:10px;border-radius:50%;background:var(--line)}
.door.open::before{background:radial-gradient(circle,#FFFFFF 0%,#A7D8F0 40%,#4B9CD3 70%,var(--surface-2) 78%);border-color:var(--accent);animation:windowglow 2.4s ease-in-out infinite alternate}
@keyframes windowglow{from{box-shadow:0 0 6px 1px rgba(167,216,240,.4)}to{box-shadow:0 0 24px 8px rgba(167,216,240,.75)}}
.door.open{border-color:var(--accent)}
.door.open:hover,.door.escaped:hover{transform:translateY(-3px)}
.door.locked{cursor:not-allowed;opacity:.55}
.door.locked:hover{animation:rattle .35s}
@keyframes rattle{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.door.escaped{border-color:var(--good)}
.door.escaped::before{background:var(--good-soft);border-color:var(--good)}
.door-level{font-size:.95rem;color:var(--muted)}
.door-name{font:var(--fdw) 1.8rem/1.02 var(--fd)}
.door-skill{color:var(--muted);font-size:1rem}
.door-status{margin-top:10px;font-weight:700}
.door.escaped .door-status{color:var(--good)}
.door.open .door-status{color:var(--accent)}
.ghost{position:absolute;top:120px;left:0;width:70px;z-index:2;cursor:pointer;opacity:.75;animation:ghostfloat 24s ease-in-out infinite 3s;border:0;background:none;padding:0}
.ghost svg{width:100%;display:block;animation:ghostbob 2.4s ease-in-out infinite}
@keyframes ghostfloat{0%{transform:translate(-120px,0);opacity:0}5%{opacity:.75}45%{transform:translate(calc(100vw - 200px),60px);opacity:.75}50%,100%{transform:translate(calc(100vw - 120px),20px);opacity:0}}
@keyframes ghostbob{50%{transform:translateY(-10px)}}
.ghost.boo svg{animation:boo .6s ease-out forwards}
@keyframes boo{40%{transform:scale(1.6)}to{transform:scale(.2);opacity:0}}
.eyes{position:absolute;display:flex;gap:7px;z-index:0;pointer-events:none}
.eyes i{width:9px;height:6px;border-radius:50%;background:#A7D8F0;box-shadow:0 0 8px #7BAFD4;animation:eyeblink 4.5s infinite}
@keyframes eyeblink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
.poster-btn-row{margin-top:22px}

/* heart monitor */
.monitor{background:#07121F;border:1px solid #24466E;border-radius:14px;padding:8px 12px 6px;color:#A7D8F0;min-width:260px;max-width:420px;width:100%}
.monitor-top{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;gap:12px}
.monitor-top b{font-variant-numeric:tabular-nums;color:#FFFFFF;font-size:1.15rem}
.heart{display:inline-block;color:#FF7A93;animation:beat linear infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.35)}24%{transform:scale(1)}}
.ecg{display:block;width:100%;height:54px;overflow:hidden}
.ecg-track{transform-box:fill-box;animation:scroll linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
.ecg path{fill:none;stroke:#7FE7FF;stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 0 3px #4FC3F7)}

/* rooms */
.room-head{position:relative;display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:space-between;align-items:flex-end}
.level{color:var(--muted);margin:0 0 4px;font-weight:500}
.lock{display:flex;gap:6px;flex-wrap:wrap;perspective:400px}
.tile{width:2.35rem;height:2.9rem;border-radius:8px;background:var(--tile);border:1.5px dashed var(--line);display:grid;place-items:center;font:var(--fdw) 1.75rem/1 var(--fd);color:transparent}
.tile.lit{background:#13385E;border:1.5px solid #7BAFD4;color:#FFFFFF;box-shadow:inset 0 0 14px rgba(167,216,240,.4),0 0 12px rgba(123,175,212,.35);text-shadow:0 0 8px rgba(167,216,240,.9)}
.tile.new{animation:flip .75s ease-out}
@keyframes flip{0%{transform:rotateX(90deg);filter:brightness(2.2)}60%{transform:rotateX(-12deg)}100%{transform:none}}
.lock.big .tile{width:2.9rem;height:3.5rem;font-size:2.2rem}
.tile.sweep{animation:sweep 1.4s ease-in-out 1 both}
@keyframes sweep{0%,100%{filter:none;transform:none}40%{filter:brightness(1.9);transform:translateY(-6px)}}
.q-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:22px}
@media (max-width:860px){.q-grid{grid-template-columns:1fr}.specimen{position:static !important}}
.solo{max-width:980px;margin:22px auto 0}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px clamp(16px,3vw,28px)}
.card.enter{animation:rise .45s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card.shake{animation:shake .45s ease-in-out}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.card.pulse{animation:pulseglow 1s ease-out}
@keyframes pulseglow{0%{box-shadow:0 0 0 0 rgba(123,175,212,.75)}100%{box-shadow:0 0 0 22px rgba(123,175,212,0)}}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qcount{color:var(--muted);margin:0;font-size:.98rem}
.qtype{font-size:.9rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;cursor:pointer;font:700 .7rem var(--fb);color:var(--muted)}
.dot.solved{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.here{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.dot:disabled{cursor:default;opacity:.5}
.prompt{font-size:1.26rem;line-height:1.42;margin:6px 0 0;font-weight:500}
.prompt:focus{outline:none}
.tapnote{margin:14px 0 0;color:var(--accent);font-weight:700}
.choices{display:grid;gap:10px;margin:18px 0 4px}
.choice,.mitem{display:block;width:100%;text-align:left;padding:12px 16px;font:inherit;line-height:1.35;color:var(--ink);background:var(--surface-2);border:2px solid transparent;border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.choice:hover:not(:disabled),.mitem:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.choice:disabled,.mitem:disabled{cursor:default}
.choice.out{opacity:.5;text-decoration:line-through;background:transparent;border-color:var(--line)}
.choice.right{border-color:var(--good);background:var(--good-soft);opacity:1}
.scope-btn{margin-top:12px}
.scope-btn .free{font-size:.82rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.scope{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px;animation:rise .3s ease-out}
.scope figure{margin:0}
.scope figcaption{font-weight:800;margin-bottom:6px}
.scope-view{background:radial-gradient(circle at 50% 45%,#18355A 0%,#081322 78%);border-radius:14px;padding:6px;border:1px solid #24466E}
.scope-note{grid-column:1/-1;margin:0;color:var(--muted);font-size:.98rem}
.cell .dr-move{animation:drmove 6s linear infinite}
@keyframes drmove{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(70px);opacity:0}}
.choice.pic{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px}
.oic{flex:none;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;background:radial-gradient(circle at 45% 40%,#25466F,#13294A);border:1px solid #2A496D}
.oic + .oic{margin-left:-6px}
.oic svg{width:36px;height:36px;display:block}
.oic.sm{width:34px;height:34px;border-radius:8px}
.oic.sm svg{width:28px;height:28px}
.choice.out .oic{filter:grayscale(1)}
[data-act="mpick"]{display:flex;align-items:center;gap:10px}
.feedback{min-height:1.5em;margin-top:14px;font-weight:500}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.hint{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.hint:focus{outline:none}
.explain{margin:12px 0 18px;padding:12px 14px;border-radius:12px;background:var(--good-soft);animation:rise .35s ease-out}
.navrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.backrow{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}
.howto{color:var(--muted);margin:12px 0 0;font-size:1rem}
.match{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:10px}
@media (max-width:620px){.match{grid-template-columns:1fr}}
.col{display:grid;gap:8px;align-content:start}
.colhead{margin:0;color:var(--muted);font-weight:700;font-size:.98rem}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.mitem.done{border-color:var(--good);background:var(--good-soft)}
.paired{display:block;margin-top:4px;font-weight:700;color:var(--good)}

/* drag tiles + drop zones */
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;min-height:46px;padding:10px;border-radius:14px;border:2px dashed var(--line)}
.tray:empty::after{content:"All placed!";color:var(--muted);align-self:center}
.dragtile{font:600 1rem/1.25 var(--fb);padding:10px 14px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;user-select:none;box-shadow:0 3px 0 var(--accent-soft);transition:transform .12s}
.dragtile:hover{transform:translateY(-2px) rotate(-1deg)}
.dragtile.sel{background:var(--accent);color:var(--accent-ink);animation:selpulse 1s ease-in-out infinite}
@keyframes selpulse{50%{transform:translateY(-3px)}}
.dragtile.lifting{opacity:.3}
.dragtile.bounce{animation:bounceback .5s}
@keyframes bounceback{20%{transform:translateX(-10px) rotate(-4deg)}50%{transform:translateX(8px) rotate(3deg)}}
.dragghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;box-shadow:0 14px 30px -8px rgba(0,0,0,.5);cursor:grabbing}
.slots{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;counter-reset:step}
.slot{display:flex;gap:12px;align-items:center;min-height:48px;padding:8px 12px;border-radius:12px;border:2px dashed var(--line);color:var(--muted)}
.slot::before{counter-increment:step;content:counter(step);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface-2);color:var(--ink)}
.slot.filled{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--ink)}
.slot.next{border-color:var(--accent);color:var(--accent);font-weight:700}
[data-drop].over,.slot.next.over,.bin.over{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.02)}
.armed [data-drop]:not(.filled){animation:armed 1.2s ease-in-out infinite}
@keyframes armed{50%{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.bin{min-height:150px;border-radius:14px;border:2px dashed var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,background .12s;cursor:pointer}
.bin h4{margin:0 0 4px;font:800 1rem var(--fb)}
.bin .placed{font-size:.95rem;padding:7px 10px;border-radius:10px;background:var(--good-soft);border:1.5px solid var(--good)}
.conn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.ctile{font:700 1rem/1.2 var(--fb);min-height:58px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;transition:transform .12s,background .12s}
.ctile:hover{transform:translateY(-2px)}
.ctile.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(.97)}
.group{border-radius:12px;padding:10px 14px;margin-top:8px;color:#0A1828}
.group b{display:block}
.g0{background:#A7D8F0}.g1{background:#F2C46D}.g2{background:#B9E3B0}
.fm{display:grid;gap:8px;margin-top:14px}
.fmrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:2px solid transparent}
.fmrow.done{border-color:var(--good);background:var(--good-soft)}
.fmrow.wrong{animation:shake .45s}
.fmbtns{display:flex;gap:6px}
.fmbtns button{font:700 .95rem var(--fb);padding:7px 12px;border-radius:999px;border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);cursor:pointer}
.fmbtns button:hover{background:var(--accent-soft)}
.verdict{font-weight:800;color:var(--good)}
.build{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:16px;margin-top:14px;align-items:center}
@media (max-width:620px){.build{grid-template-columns:1fr}}
.brow{padding:8px 0;border-bottom:1px solid var(--line)}
.brow.bad .bname{color:var(--bad)}
.bname{font-weight:700;margin-bottom:6px;font-size:1rem}
.seg{display:inline-flex;border:1.5px solid var(--accent);border-radius:999px;overflow:hidden}
.seg button{font:700 .95rem var(--fb);padding:7px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.preview{background:radial-gradient(circle,#18355A,#081322);border-radius:16px;padding:10px}
.preview svg{width:100%;display:block}
.scr-slots{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.scr-slot{width:2.6rem;height:3rem;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font:var(--fdw) 1.9rem var(--fd)}
.scr-slot.f{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.scr-tiles{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ltile{width:2.6rem;height:3rem;border-radius:10px;border:0;background:#13385E;color:#FFFFFF;font:var(--fdw) 1.9rem var(--fd);cursor:pointer;box-shadow:0 4px 0 #0A1828;transition:transform .1s}
.ltile:hover{transform:translateY(-3px) rotate(-3deg)}
.ltile:disabled{opacity:.18;cursor:default;transform:none}
.scr-wrap.wrong .scr-slots{animation:shake .45s}

/* specimen */
.specimen{position:relative;background:radial-gradient(circle at 50% 45%,#18355A 0%,#081322 78%);border-radius:20px;padding:10px 10px 6px;border:1px solid #24466E;position:sticky;top:12px}
.specimen-cap{color:#A7D8F0;font-size:.95rem;margin:4px 10px 4px}
svg.cell{width:100%;height:auto;display:block}
.cell.tappable .org{cursor:pointer}
.cell .org:focus{outline:none}
.cell .org:focus-visible{filter:drop-shadow(0 0 3px #FFE08A) drop-shadow(0 0 6px #FFE08A)}
.cell .org.flash{animation:badflash .7s ease-out}
@keyframes badflash{0%,100%{filter:none}30%{filter:drop-shadow(0 0 7px #FF5A7A) brightness(1.35)}}
.cell .org.found{filter:drop-shadow(0 0 5px #FFFFFF) drop-shadow(0 0 12px #7FC4EA)}
.cell .wob,.cell .jit,.cell .breathe,.cell .sway,.cell .drift,.cell .bob{transform-box:fill-box;transform-origin:center}
.cell .wob{animation:wob 7s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(2px,-2px) rotate(3deg)}66%{transform:translate(-2px,1px) rotate(-2deg)}}
.cell .jit{animation:jit 2.6s steps(4) infinite}
@keyframes jit{25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
.cell .breathe{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025)}}
.cell .sway{animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:translateX(3px)}}
.cell .drift{animation:vdrift 5s ease-in-out infinite}
@keyframes vdrift{0%{transform:translate(0,0);opacity:.4}50%{opacity:1}100%{transform:translate(16px,-8px);opacity:.3}}
.cell .bob{animation:lbob 4.5s ease-in-out infinite}
@keyframes lbob{50%{transform:translate(0,-3px)}}
.pin-ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.16)}}
.cell [data-drop]{cursor:pointer}
.cell [data-drop].over .pin-ring{fill:#2F7DB8;stroke:#FFFFFF}
.cell.armed [data-drop] .pin-ring{stroke:#FFFFFF;animation-duration:.8s}

/* pumpkins */
.pumpkin{position:absolute;z-index:3;border:0;background:none;padding:0;font-size:1.5rem;line-height:1;cursor:pointer;opacity:.5;filter:saturate(.8);animation:pumpkinglow 2.6s ease-in-out infinite}
.pumpkin:hover{opacity:1;transform:scale(1.25) rotate(-8deg)}
@keyframes pumpkinglow{50%{opacity:.8;filter:drop-shadow(0 0 6px #F2A541)}}

/* clues */
.clue{background:#F6F1E4;color:#1D2A3A;border-radius:4px;padding:18px 20px;box-shadow:0 12px 26px -16px rgba(0,0,0,.6);transform:rotate(-.6deg);border-top:6px solid #7BAFD4}
.clue h3{font-size:1.55rem;margin:0 0 2px;line-height:1.1}
.clue .src{font-size:.92rem;color:#4F6478;margin:0 0 8px}
.clue p:last-child{margin:0}
.clue-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:20px 0 24px}
.clue-row .clue{transform:none;font-size:1.02rem;max-width:none}
.clue-row .clue:nth-child(2){transform:rotate(.5deg)}
.clue-row .clue:nth-child(3){transform:rotate(-.4deg)}

/* unlock */
.unlock{max-width:980px;margin:0 auto}
.vault{position:relative;height:150px;max-width:460px;margin:22px 0 18px;perspective:900px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#FFFFFF 0%,#A7D8F0 30%,#2F6EA3 65%,#0A1828 100%)}
.vault-msg{position:absolute;inset:0;display:grid;place-items:center;font:var(--fdw) 1.8rem/1 var(--fd);color:#0A1828;opacity:0;animation:fadein .6s ease-out 1.1s forwards}
.leaf{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#1A3150 0 18px,#163049 18px 20px);border:2px solid #4B9CD3}
.leaf.l{left:0;transform-origin:left center;animation:openL 1.3s cubic-bezier(.5,0,.2,1) .35s forwards}
.leaf.r{right:0;transform-origin:right center;animation:openR 1.3s cubic-bezier(.5,0,.2,1) .35s forwards}
.leaf::after{content:"";position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#A7D8F0;transform:translateY(-50%)}
.leaf.l::after{right:10px}.leaf.r::after{left:10px}
@keyframes openL{to{transform:rotateY(-105deg)}}
@keyframes openR{to{transform:rotateY(105deg)}}
@keyframes fadein{to{opacity:1}}
.unlock .clue{margin:20px 0 26px;opacity:0;animation:cluein .7s ease-out 1.4s forwards}
@keyframes cluein{from{opacity:0;transform:translateY(24px) rotate(-3deg)}to{opacity:1;transform:rotate(-.6deg)}}

/* poster */
.poster{position:relative;max-width:940px;margin:-8px auto 0;color:#FFFFFF;background:radial-gradient(circle at 85% 8%,rgba(167,216,240,.35),transparent 30%),linear-gradient(170deg,#132E4E 0%,#0A1828 60%,#07111D 100%);border:6px solid #7BAFD4;outline:2px solid #FFFFFF;outline-offset:-12px;border-radius:16px;padding:24px clamp(18px,3.5vw,38px) 18px;overflow:hidden;animation:rise .6s ease-out}
.poster .pmoon{position:absolute;right:28px;top:22px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 38% 36%,#FFFFFF,#A7D8F0 60%,#7BAFD4);box-shadow:0 0 40px 10px rgba(167,216,240,.4)}
.poster .pbat{position:absolute;width:54px;fill:#4B9CD3;opacity:.8}
.p-kicker{margin:0;color:#A7D8F0;font-weight:700;letter-spacing:.02em}
.p-title{font:var(--fdw) clamp(2.8rem,7vw,4.6rem)/.9 var(--fd);margin:4px 0 2px;color:#FFFFFF;text-shadow:0 0 18px rgba(123,175,212,.8),0 4px 0 #13385E}
.p-name{font:var(--fdw) clamp(2rem,5vw,3rem)/1 var(--fd);color:#A7D8F0;margin:6px 0 4px;word-break:break-word}
.p-sub{color:#D9E9F5;margin:0 0 14px;max-width:46ch}
.stamp{position:absolute;right:30px;top:118px;transform:rotate(12deg);border:4px double #A7D8F0;color:#A7D8F0;border-radius:10px;padding:6px 14px;text-align:center;font:var(--fdw) 1.6rem/1 var(--fd);opacity:.9;animation:stampin .5s cubic-bezier(.2,1.6,.4,1) .4s both}
.stamp small{display:block;font:700 .8rem var(--fb);margin-top:3px}
@keyframes stampin{from{transform:rotate(30deg) scale(2.4);opacity:0}}
@media (max-width:640px){.stamp{position:static;display:inline-block;margin:0 0 12px;transform:rotate(-4deg)}.poster .pmoon{width:56px;height:56px}}
.p-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 16px}
@media (max-width:640px){.p-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.p-stat{background:rgba(167,216,240,.1);border:1px solid rgba(167,216,240,.35);border-radius:12px;padding:8px 10px;text-align:center}
.p-stat b{display:block;font:800 1.35rem var(--fb);color:#FFFFFF;font-variant-numeric:tabular-nums}
.p-stat span{font-size:.85rem;color:#A7D8F0}
.p-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:760px){.p-grid{grid-template-columns:1fr}}
.p-box{background:rgba(7,17,29,.55);border:1px solid rgba(167,216,240,.3);border-radius:14px;padding:12px 14px}
.p-box h3{margin:0 0 6px;font-size:1.5rem;color:#A7D8F0}
.lvl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:5px 0;border-bottom:1px solid rgba(167,216,240,.18)}
.lvl:last-child{border-bottom:0}
.lvl-name{font-weight:700;font-size:.98rem}
.lvl-score{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.segs{display:flex;gap:4px;grid-column:1/-1}
.segs i{flex:1;height:10px;border-radius:3px;background:rgba(167,216,240,.15);border:1px solid rgba(167,216,240,.35)}
.segs i.ok{background:#7BAFD4;border-color:#A7D8F0;box-shadow:0 0 6px rgba(167,216,240,.6)}
.segs i.meh{background:repeating-linear-gradient(45deg,#7BAFD4 0 3px,transparent 3px 6px)}
.rating{grid-column:1/-1;font-size:.9rem;color:#D9E9F5}
.rating b{color:#FFFFFF}
.p-legend{font-size:.82rem;color:#A7D8F0;margin:8px 0 0}
.p-list{margin:0;padding-left:1.1em;font-size:.95rem}
.p-list li{margin:3px 0}
.p-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.p-badge{font-size:.85rem;font-weight:700;background:rgba(123,175,212,.2);border:1px solid #7BAFD4;border-radius:999px;padding:4px 10px}
.p-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;color:#A7D8F0;font-size:.95rem}
.p-foot b{font:var(--fdw) 1.5rem var(--fd);color:#FFFFFF}
.p-foot .go{display:inline-flex;align-items:center;gap:10px}
.p-foot .mustang-badge{display:inline-grid;place-items:center;background:#EAF4FB;border:2px solid #A7D8F0;border-radius:12px;padding:3px 8px;box-shadow:0 0 14px rgba(123,175,212,.45)}
.p-foot .mustang-badge img{display:block;height:1.6em;width:auto}
.dxcard{max-width:940px;margin:18px auto 0}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(5,12,22,.66);display:grid;place-items:center;padding:20px;z-index:40;overflow:auto}
.sheet{background:var(--bg);color:var(--ink);border-radius:18px;max-width:740px;width:100%;padding:24px;max-height:88vh;overflow:auto}
.sheet.pop{animation:rise .3s ease-out}
.sheet .clue{margin:16px 0}
.menu-list{display:grid;gap:10px;margin-top:16px}
.menu-list .btn{justify-content:center}
.menu-note{color:var(--muted);font-size:.95rem;margin:14px 0 0}
.danger{background:var(--bad) !important;color:#FFFFFF !important}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}
.bdg{padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);font-size:.95rem}
.bdg.got{border-color:var(--accent);background:var(--accent-soft)}
.bdg.no{opacity:.5}
.bdg b{display:block}

/* centriole mitosis animation */
.cell [data-peek]{cursor:pointer}
.cell [data-peek]:hover{filter:drop-shadow(0 0 4px #FFE08A)}
.mito-open{margin-top:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mchips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:14px 0 10px}
.mchips li{font-weight:700;font-size:.92rem;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);animation:mchip 15s linear var(--d) infinite}
@keyframes mchip{0%,19.5%{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}20%,100%{background:transparent;border-color:var(--line);color:var(--ink)}}
.mito-stage{background:radial-gradient(circle at 50% 45%,#18355A 0%,#081322 78%);border-radius:16px;padding:8px;border:1px solid #24466E}
.mito-stage svg{width:100%;height:auto;display:block}
.mst{opacity:0;animation:mst 15s linear var(--d) infinite}
@keyframes mst{0%{opacity:0}2%,18%{opacity:1}20%,100%{opacity:0}}
.mcaps{display:grid;margin-top:12px}
.mcaps p{grid-area:1/1;margin:0;font-size:1.05rem;opacity:0;animation:mst 15s linear var(--d) infinite}
.mito.paused *{animation-play-state:paused !important}
.mito-anim g{transform-box:view-box}
.mito-anim .m-cl{animation:m-cl 15s ease-in-out var(--d) infinite}
@keyframes m-cl{0%,3%{transform:translate(112px,-62px)}13%,100%{transform:none}}
.mito-anim .m-cr{animation:m-cr 15s ease-in-out var(--d) infinite}
@keyframes m-cr{0%,3%{transform:translate(-112px,-62px)}13%,100%{transform:none}}
.mito-anim .m-in{animation:m-in 15s linear var(--d) infinite}
@keyframes m-in{0%,9%{opacity:0}16%,100%{opacity:1}}
.mito-anim .m-out{animation:m-out 15s linear var(--d) infinite}
@keyframes m-out{0%,3%{opacity:1}12%,100%{opacity:0}}
.mito-anim .m-grow-l,.mito-anim .m-grow-r{animation:m-grow 15s ease-out var(--d) infinite}
@keyframes m-grow{0%,2%{transform:scale(.12)}12%,100%{transform:none}}
.mito-anim .m-pull-l,.mito-anim .m-pull-r{animation:m-pull 15s ease-in-out var(--d) infinite}
@keyframes m-pull{0%,3%{transform:scaleX(2.15)}16%,100%{transform:none}}
.m-grow-l,.m-pull-l{transform-origin:48px 100px}
.m-grow-r,.m-pull-r{transform-origin:272px 100px}
.mito-anim .m-go-l{animation:m-go-l 15s ease-in-out var(--d) infinite}
@keyframes m-go-l{0%,3%{transform:translateX(60px)}16%,100%{transform:none}}
.mito-anim .m-go-r{animation:m-go-r 15s ease-in-out var(--d) infinite}
@keyframes m-go-r{0%,3%{transform:translateX(-60px)}16%,100%{transform:none}}
.mito-anim .m-apart-l{animation:m-apart-l 15s ease-out var(--d) infinite}
@keyframes m-apart-l{0%,2%{transform:translateX(12px)}12%,100%{transform:none}}
.mito-anim .m-apart-r{animation:m-apart-r 15s ease-out var(--d) infinite}
@keyframes m-apart-r{0%,2%{transform:translateX(-12px)}12%,100%{transform:none}}
.mito-anim .m-pulse{animation:m-pulse 15s ease-in-out var(--d) infinite}
@keyframes m-pulse{0%,9%{opacity:0}12%{opacity:1}15%{opacity:.3}18%{opacity:1}20%,100%{opacity:0}}
.mito-static{display:none;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.mito-static figure{margin:0}
.mito-static figcaption{margin-top:6px;font-size:1rem}
.mito-static .m-out{display:none}

/* Reduce motion is a game setting (PREFS.motion), not the device's prefers-reduced-motion, so animations run by default. */
:root[data-motion="reduced"] .mito-anim{display:none}
:root[data-motion="reduced"] .mito-static{display:grid}
:root[data-motion="reduced"],:root[data-motion="reduced"] *,:root[data-motion="reduced"] *::before,:root[data-motion="reduced"] *::after{animation:none !important;transition:none !important}
:root[data-motion="reduced"] :is(.bat,.confetti,.lightning,.spider,.ghost,.spark,.floatpts){display:none !important}
:root[data-motion="reduced"] :is(.vault-msg,.unlock .clue){opacity:1}
:root[data-motion="reduced"] .leaf{display:none}

/* ---------- v4: vector icons ---------- */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:2.1rem;height:2.1rem}
.ic.xl{width:2.6rem;height:2.6rem}
.btn .ic,.chip .ic{width:1.1em;height:1.1em}
.chip{display:inline-flex;align-items:center;gap:6px}
.hud{display:inline-flex;align-items:center;gap:6px}
.hud .ic{color:var(--accent)}
.hud-sep{width:1px;height:1.1em;background:var(--line);margin:0 4px}
.lvchip{font:800 .8rem var(--fb);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 8px}
.streak .ic{color:#E8833A}
.candle .cflame{animation:cflame 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}

.case-ic{color:var(--accent);display:inline-block}
.case:hover .case-ic,.case.sel .case-ic{animation:hop .6s ease-in-out infinite alternate}
.qtype{display:inline-flex;align-items:center;gap:6px}
.verdict{display:inline-flex;align-items:center;gap:4px}
.tapnote{display:flex;align-items:center;gap:8px}
.bin h4{display:flex;align-items:center;gap:6px}
.bin h4 .ic{color:var(--accent)}
.toast .te{color:#A7D8F0;display:grid;place-items:center}
.toast .te .ic{width:2rem;height:2rem}
.toast .te .ic.pk{width:2.2rem;height:2.2rem}
.pumpkin{width:30px;height:30px}
.pumpkin svg{width:100%;height:100%;display:block}
.door-status{display:inline-flex;align-items:center;gap:6px}

/* ---------- v4: hero scene ---------- */
.title{max-width:none;margin-top:0}
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid #24466E;background:#07111D;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.scene-wrap{position:relative;height:clamp(220px,26vw,320px)}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-text{position:absolute;left:clamp(16px,3.5vw,40px);top:clamp(16px,3.5vw,38px);max-width:min(48%,520px);z-index:2}
.hero-text .kicker{color:#A7D8F0;text-shadow:0 2px 6px #000}
.hero h1{color:#FFFFFF;text-shadow:0 0 22px rgba(123,175,212,.7),0 3px 0 #0A1828;margin:.12em 0 0}

  .hero-text{position:static;max-width:none;padding:16px 18px 18px;background:#07111D}

}
.title-body{margin:22px 0 0}
.scene .tw{animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}
.scene .cloud{animation:clouddrift 60s linear infinite}
@keyframes clouddrift{from{transform:translateX(-260px)}to{transform:translateX(260px)}}
.scene .fogA{animation:fog 22s ease-in-out infinite alternate}
.scene .fogB{animation:fog 30s ease-in-out infinite alternate-reverse}
@keyframes fog{to{transform:translateX(120px)}}
.scene .wf{animation:wflick 4.5s steps(1) infinite}
@keyframes wflick{0%,100%{opacity:1}12%{opacity:.25}14%{opacity:1}52%{opacity:.4}55%{opacity:1}}
.scene .bolt{animation:boltflash 17s linear infinite 5s}

@keyframes boltflash{0%,91%,100%{opacity:0}91.5%{opacity:1}92.3%{opacity:0}93%{opacity:.8}93.6%{opacity:0}}
@keyframes skyflash{0%,91%,100%{opacity:0}91.5%{opacity:.18}92.3%{opacity:0}93%{opacity:.12}93.6%{opacity:0}}
.scene .arm{transform-box:fill-box;transform-origin:0% 100%;animation:wave 1.4s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-35deg)}to{transform:rotate(25deg)}}

.scene .sbat{transform-box:view-box}
.scene .sb1{animation:sb1 9s ease-in-out infinite}
.scene .sb2{animation:sb2 12s ease-in-out infinite}
.scene .sb3{animation:sb3 14s ease-in-out infinite}
@keyframes sb1{0%{transform:translate(700px,90px)}25%{transform:translate(850px,40px)}50%{transform:translate(960px,120px)}75%{transform:translate(820px,170px)}100%{transform:translate(700px,90px)}}
@keyframes sb2{0%{transform:translate(950px,60px)}33%{transform:translate(760px,30px)}66%{transform:translate(690px,140px)}100%{transform:translate(950px,60px)}}
@keyframes sb3{0%{transform:translate(1080px,180px)}50%{transform:translate(880px,70px)}100%{transform:translate(1080px,180px)}}
.scene .sbat .wing{transform-box:fill-box;transform-origin:center;animation:flap .2s ease-in-out infinite alternate}
.scene .pkglow{animation:pkglow 2.2s ease-in-out infinite alternate}
@keyframes pkglow{to{opacity:.45}}

/* proficiency scale */
.scale{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 4px}
@media (max-width:620px){.scale{grid-template-columns:1fr}}

.history b{font-family:var(--fd);font-weight:400;font-size:1.3rem}

/* hint confirm */
.hintask{margin-top:12px;padding:12px 14px;border-radius:12px;border:2px solid var(--accent);background:var(--accent-soft)}
.hintask p{margin:0 0 10px;font-weight:500}

/* emblems + corridor */
.room-title{display:flex;align-items:flex-end;gap:14px}
.emblem{width:110px;height:auto;flex:none;display:block}
.intro-art{display:flex;justify-content:center;margin:-6px 0 10px}
.intro-art .emblem{width:min(260px,70%)}
@media (max-width:620px){.room-title .emblem{width:76px}}
.emb .bub{animation:bub 2.2s ease-in infinite;transform-box:fill-box;transform-origin:center}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.emb .flame{animation:fl .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}
@keyframes fl{to{transform:scaleY(.75) skewX(6deg)}}
.emb .beam{animation:beam 2.6s ease-in-out infinite alternate}
@keyframes beam{from{opacity:.25}to{opacity:.7}}
.emb .floaty{animation:floaty 4s ease-in-out infinite;transform-box:fill-box}
@keyframes floaty{50%{transform:translate(4px,-6px)}}
.emb .swing{transform-box:fill-box;transform-origin:50% 0%;animation:swing 2.4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.emb .snow{animation:snow 4s linear infinite}
@keyframes snow{from{transform:translateY(-10px);opacity:0}20%{opacity:1}to{transform:translateY(90px);opacity:0}}
.emb .under{animation:wflick 3.2s steps(1) infinite}
.corridor{display:block;width:100%;height:clamp(110px,16vw,170px);border-radius:16px;margin-top:18px;border:1px solid #24466E}
.corridor .lamp{animation:lampflick 6s steps(1) infinite}

.corridor .farghost{animation:farghost 11s ease-in-out infinite}
@keyframes farghost{0%,60%,100%{opacity:0}70%,85%{opacity:.7}}

/* poster v4 */
.p-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}

.grade{display:flex;align-items:center;gap:14px;background:rgba(7,17,29,.6);border:2px solid #7BAFD4;border-radius:18px;padding:12px 16px;box-shadow:0 0 30px rgba(123,175,212,.25)}
.crest{width:96px;height:auto;flex:none;animation:stampin .6s cubic-bezier(.2,1.6,.4,1) .3s both}
.grade-t b{display:block;font:var(--fdw) 2rem/1 var(--fd);color:#FFFFFF}
.grade-t span{display:block;font:var(--fdw) 1.5rem/1.1 var(--fd);color:#A7D8F0}
.grade-t small{display:block;margin-top:6px;font-size:.9rem;color:#D9E9F5;max-width:24ch}

.pscale{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

.pscale i.on{background:#7BAFD4;color:#0A1828;border-color:#FFFFFF}
.p-stat b{display:flex;align-items:center;justify-content:center;gap:6px}
.p-stat .ic{color:#A7D8F0}
.poster .stamp{position:static;display:inline-block;transform:rotate(-6deg);margin:2px 0 0}
.skyline{display:block;width:100%;height:130px;margin-top:12px;pointer-events:none}
.poster > *:not(.skyline):not(.pbat){position:relative;z-index:1}
.p-foot{align-items:center}
.p-foot span{display:inline-flex;align-items:center;gap:8px}
.p-foot b{display:inline-flex;align-items:center;gap:8px}
.lvl-hints{grid-column:1/-1;font-size:.85rem;color:#A7D8F0}
.menu-list .btn{gap:10px}
@media (max-width:620px){.ltile,.scr-slot{width:2.15rem;height:2.7rem;font-size:1.6rem}}

.wrapseg{justify-self:start}

/* Build a unique game from a seed */
function buildGame(seed, caseId){
  const R = mulberry32(seed);
  const sh = a => { const b = a.slice(); for(let i = b.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const sample = (a, k) => sh(a).slice(0, k);
  const pickOne = a => a[Math.floor(R() * a.length)];
  const mcq = (o, a) => { const ans = a == null ? (o.a == null ? 0 : o.a) : a; const perm = sh(o.options.map((_, i) => i)); return Object.assign({}, o, {type:"mc", options: perm.map(i => o.options[i]), a: perm.indexOf(ans)}); };

  /* Level 1 */
  const taps = sample(TAP_POOL, 3);
  const pinKeys = Object.keys(STRUCT).filter(k => STRUCT[k].pin);
  const pinMC = sample(pinKeys.filter(k => !taps.includes(k)), 2);
  const uns = pickOne(["vesicle","lysosome","nucleolus","ribosome"].filter(k => !pinMC.includes(k)));
  const labKeys = sample(pinKeys.filter(k => !pinMC.includes(k) && k !== uns), 4);
  const decoys = sample(["Chloroplast","Cell wall","Central vacuole"], 2);
  const labels = sh(labKeys.map(k => STRUCT[k].label).concat(decoys));
  const tapQ = k => Object.assign({type:"tap", target:k}, STRUCT[k].tap);
  const pinQ = k => { const s = STRUCT[k]; return mcq({pin:s.pin, target:k, prompt:s.pinq.prompt, options:[s.label].concat(s.pinq.distract), a:0, hint:s.pinq.hint, explain:s.pinq.explain, tag:s.pinq.tag}); };
  const us = STRUCT[uns]; let scr = us.word; let guard = 0;
  while(scr === us.word && guard++ < 20) scr = sh([...us.word]).join("");
  const unsQ = {type:"unscramble", pin:us.pin, target:uns, word:us.word, scr, tag:us.pinq.tag,
    prompt:`Pin ${us.pin} points to ${us.wdesc}. Unscramble the letters to name it. Tap the tiles or type on your keyboard.`,
    hint:`It’s a ${us.word.length}-letter word that starts with ${us.word[0]}. ${us.pinq.hint}`, explain:us.pinq.explain};
  const labelQ = {type:"label", tag:"Labeling organelles on a diagram",
    prompt:"Four labels fell off the specimen! Drag each label onto the right pin (or tap a label, then tap a pin). Careful: two of these labels belong to plant cells.",
    labels, tray: labels.map((_, i) => i),
    pins: labKeys.map(k => ({pin: STRUCT[k].pin, ans: labels.indexOf(STRUCT[k].label), target:k})),
    hint: labKeys.map(k => STRUCT[k].look).join(" ") + " Chloroplasts, cell walls, and central vacuoles only show up in plant cells.",
    explain: "Each label matches its look: " + labKeys.map(k => STRUCT[k].look.replace(/\.$/, "").toLowerCase()).join("; ") + ". Human cells have no chloroplasts, cell walls, or large central vacuole."};
  const room0 = [tapQ(taps[0]), pinQ(pinMC[0]), tapQ(taps[1]), labelQ, tapQ(taps[2]), unsQ, pinQ(pinMC[1]), mcq(pickOne(IMPOSTORS))];

  /* Level 2 */
  const rk = sample(Object.keys(RIDDLES), 4);
  const riddle = k => mcq(Object.assign({}, RIDDLES[k], {a:0}));
  let mpool = MATCHP.filter(p => !rk.includes(p.k)); if(mpool.length < 4) mpool = MATCHP;
  const mp = sample(mpool, 4);
  const matchQ = {type:"match", tag:"Matching organelles to their jobs", prompt:"Four bottles have lost their labels. Match each job to the organelle that does it.",
    pairs: mp.map(p => ({fn:p.fn, org:p.org})), order: sh([0,1,2,3]),
    hint:"Start with the one you’re surest of, then use the process of elimination for the rest.",
    explain: mp.map(p => `${p.org}: ${p.fn.charAt(0).toLowerCase() + p.fn.slice(1)}`).join(". ") + "."};
  const ov = pickOne(ORDERS);
  const orderQ = Object.assign({type:"order"}, ov, {tray: sh(ov.steps.map((_, i) => i))});
  const cv = pickOne(CONNS);
  const connQ = Object.assign({type:"connections", tag:"Grouping organelles by job", prompt:"Connections! These nine organelles fall into three groups of three. Select three that share something in common, then check your group."}, cv,
    {tiles: sh(cv.groups.flatMap(g => g.items))});
  let fm; guard = 0;
  do { fm = sample(FMPOOL, 5); } while((fm.filter(x => x.fact).length < 2 || fm.filter(x => !x.fact).length < 2) && guard++ < 50);
  const fmQ = {type:"factmyth", tag:"Fact or myth: organelle jobs", prompt:"Lightning round! Decide whether each potion label is a fact or a myth.", items: fm,
    hint:"Watch for statements that swap one organelle’s job with another’s. Remember that only mitochondria make most of the ATP and only plant cells have walls.",
    explain:"The myths: " + fm.filter(x => !x.fact).map(x => x.fix).join(" ")};
  const room1 = [riddle(rk[0]), riddle(rk[1]), matchQ, orderQ, riddle(rk[2]), connQ, riddle(rk[3]), fmQ];

  /* Level 3 */
  const bv = R() < .5 ? "rbc" : "sperm";
  const buildQ = Object.assign({type:"build", variant:bv}, BUILDS[bv]);
  const cats = sample(Object.keys(SORTCATS), 3);
  const sortTiles = sh(cats.flatMap(c => sample(SORTCATS[c].tiles, 2).map(t => ({t, bin:c}))));
  const sortQ = {type:"sort", tag:"Matching specialized cells to their organelles",
    prompt:"Six frozen samples, three bins. Drag each cell into the bin for the organelle it would have extra of (or tap a cell, then tap a bin).",
    bins: cats.map(c => ({id:c, name:SORTCATS[c].name, icon:SORTCATS[c].icon})), tiles: sortTiles, tray: sortTiles.map((_, i) => i),
    hint:"Ask what each cell spends its day doing: burning energy, building proteins to send out, digesting things, or making lipids and breaking down toxins.",
    explain:"Energy-hungry cells load up on mitochondria, protein exporters load up on rough ER, digesting cells load up on lysosomes, and cells that make lipids or break down toxins load up on smooth ER."};
  const mk = sample(Object.keys(L3MC).filter(k => k !== bv), 6);
  const drawer = (k, n) => { const o = L3MC[k]; return mcq(Object.assign({}, o, {prompt:`Drawer ${n} holds ${o.p}`, a:0, l3:k})); };
  const room2 = [drawer(mk[0],1), sortQ, drawer(mk[1],3), drawer(mk[2],4), buildQ, drawer(mk[3],6), drawer(mk[4],7), drawer(mk[5],8)];

  const C = CASE_BY[caseId] || CASES[0];
  const fin = C.final.map(q => q.type === "mc" ? mcq(q) : Object.assign({}, q));
  return {rooms:[room0, room1, room2], final: fin};
}

const NUC_ART = (() => {
  const cx = 300, cy = 215, rad = a => a*Math.PI/180, f = n => n.toFixed(1);
  const pores = [0,1,2,3,4,5,6].map(i => 25 + i*360/7);
  let ribs = "";
  for(let i = 0; i < 34; i++){
    const a = i*360/34 + 4;
    if(pores.some(p => Math.abs(((a - p + 540) % 360) - 180) < 7)) continue;
    ribs += `<circle cx="${f(cx + 77*Math.cos(rad(a)))}" cy="${f(cy - 77*Math.sin(rad(a)))}" r="2.3" fill="#F4D57A"/>`;
  }
  const pore = pores.map(a => `<g transform="translate(${f(cx + 69*Math.cos(rad(a)))},${f(cy - 69*Math.sin(rad(a)))}) rotate(${f(-a)})"><rect x="-6" y="-3.2" width="12" height="6.4" fill="#3B2858"/><path d="M-4.5,-3.6h9M-4.5,3.6h9" stroke="#B48BE0" stroke-width="1.6" stroke-linecap="round"/></g>`).join("");
  const R = mulberry32(1031), cols = ["#B79BE0","#9F83CC","#C9B3EE","#8E72BE"];
  let chrom = "";
  for(let i = 0; i < 60; i++){
    const r0 = 60*Math.sqrt(R()), t0 = R()*360;
    let x = cx + r0*Math.cos(rad(t0)), y = cy + r0*Math.sin(rad(t0)), h = R()*360, d = `M${f(x)},${f(y)}`;
    for(let k = 0; k < 7; k++){
      h += (R() - .5)*100;
      if(Math.hypot(x - cx, y - cy) > 52) h = Math.atan2(cy - y, cx - x)*180/Math.PI + (R() - .5)*60;
      const w = k % 2 ? 38 : -38, qx = x + 7*Math.cos(rad(h + w)), qy = y + 7*Math.sin(rad(h + w));
      x += 12*Math.cos(rad(h)); y += 12*Math.sin(rad(h));
      d += ` Q${f(qx)},${f(qy)} ${f(x)},${f(y)}`;
    }
    chrom += `<path d="${d}" stroke="${cols[i % 4]}" stroke-width="${f(1.1 + R()*.6)}" stroke-opacity="${f(.55 + R()*.3)}" fill="none" stroke-linecap="round"/>`;
  }

function aboutCentrioles(q){
  const has = s => /centriole/i.test(s || "");
  if(q.target === "centrioles") return true;
  if(q.type === "label") return q.pins.some(p => p.target === "centrioles");
  if(q.type === "mc") return has(q.options[q.a]);
  if(q.type === "match") return q.pairs.some(p => has(p.org));
  if(q.type === "connections") return q.groups.some(g => g.items.some(has));
  if(q.type === "factmyth") return q.items.some(x => has(x.s));
  return false;
}

  app.innerHTML = (S.screen !== "title" ? topbar() : "") + views[S.screen]() + viewOverlay();
  fx = null; enterFx = false; S.cur.bounce = null; S.cur.wrongRow = null; S.cur.flashOrg = null; S.cur.bad = false;
  if(S.screen === "title") titleShown = true;
  flashClock = S.screen === "hall" ? {start:performance.now(), delay:4000, period:19000, at:17195, last:-1} : S.screen === "title" ? {start:performance.now(), delay:5000, period:17000, at:15555, last:-1} : null;
  document.getElementById("bones").classList.toggle("on", S.screen === "room" || S.screen === "hall");

/* ======================= GAME LOGIC ======================= */
function closeOverlay(){
  if(S.overlay === "mitosis" && mitoBack) focusSel = mitoBack;
  S.overlay = null; mitoBack = null;
}
function setView(i){ S.view = i; S.cur = freshCur(); focusSel = ".prompt"; enterFx = true; }
function enterRoom(r){
  if(!(r === 0 || doneRoom(r-1))) return;
  S.room = r; S.screen = "room"; sfx("door");
  setView(doneRoom(r) ? 0 : S.prog[r]);
  window.scrollTo(0,0);
  if(S.intro[r] && !doneRoom(r)) setTimeout(() => bonesSay(pick(QUIPS_IDLE)), 600);
}
function miss(text, opts){
  const c = S.cur;
  c.misses++; c.msg = text; c.msgType = "bad"; S.streak = 0; fx = "shake"; c.ask = false;
  if(opts && opts.bounce) c.bounce = opts.bounce;
  if(opts && opts.row != null) c.wrongRow = opts.row;
  sfx("wrong"); bonesSay(pick(QUIPS_SAD), "sad"); save(); render();
}
function solve(){
  const r = S.room, i = S.view, c = S.cur;
  const base = c.misses === 0 ? 100 : c.misses === 1 ? 60 : 30;
  let pts = c.hint ? Math.max(10, base - 20) : base;
  if(c.misses === 0 && !c.hint){ S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); if(S.streak >= 3) pts += 25; } else S.streak = 0;
  S.rec[`${r}-${i}`] = {m:c.misses, h:c.hint};
  S.prog[r] = Math.max(S.prog[r], i + 1);
  c.just = true; c.sel = null; c.ask = false;
  c.msg = pick(r < 3 ? RIGHT : RIGHT_FINAL) + (S.streak >= 3 ? ` ${S.streak} in a row! Streak bonus!` : ""); c.msgType = "good";
  addPoints(pts); sparkle(); fx = "pulse"; focusSel = '[data-act="next"]';
  if(S.streak >= 5) award("streak");
  if(c.misses >= 2) award("comeback");
  if(doneRoom(r)){
    if(r < 3 && roomQs(r).every((q,k) => { const x = S.rec[`${r}-${k}`]; return x && x.m === 0 && !x.h; })) award("r" + r);
    if(r === 3 && !S.finished){
      S.finished = true; award("closed");
      if(S.activeMs <= 60*60000) award("owl");
      if(S.hints === 0) award("fearless");
      S.history.push({c:S.caseId, h:S.hints, l:levelFor(S.hints), p:S.points, d:new Date().toISOString().slice(0,10)});
    }
  }
  sfx(r < 3 ? "correct" : "chime"); bonesSay(pick(QUIPS_HAPPY), "happy"); save(); render();
}
function next(){
  const r = S.room, n = nQ(r);
  if(S.view + 1 < n && S.view + 1 <= S.prog[r]){ setView(S.view + 1); }
  else if(S.view + 1 >= n && doneRoom(r)){
    if(r < 3){ if(!S.unlockSeen[r]){ S.unlockSeen[r] = true; S.screen = "unlock"; sfx("unlock"); sfx(["vault","bubble","drawer"][r], 450); sfx("paper", 1500); } else { S.screen = "hall"; sfx("creak"); } }
    else { S.screen = "poster"; sfx("fanfare"); sfx("bell", 700); }
    S.cur = freshCur(); window.scrollTo(0,0);
  }
  save(); render();
}
function choose(i){
  const q = curQ(); if(isSolved() || S.cur.elim.includes(i)) return;
  if(i === q.a) solve(); else { S.cur.elim.push(i); miss(pick(["The lock rattles but holds. That one’s crossed off.","A cold draft slips under the door. Not that one.","Something scratches inside the walls. Not quite!"])); }
}
function tapOrg(org){
  const q = curQ(); if(isSolved() || q.type !== "tap") return;
  if(org === q.target) solve();
  else { S.cur.flashOrg = org; miss(`That’s ${ORG[org]}. Keep looking for ${ORG[q.target]}.`); }
}
function matchClick(side, i){
  const q = curQ(), c = S.cur; if(isSolved() || c.matchDone.includes(i)) return;
  if(!c.msel || c.msel.side === side){ c.msel = {side, i}; c.msg = ""; c.msgType = ""; save(); render(); return; }
  if(c.msel.i === i){
    c.matchDone.push(i); c.msel = null;
    if(c.matchDone.length === q.pairs.length){ solve(); return; }
    sfx("drop"); c.msg = "Matched! The label sticks to the bottle."; c.msgType = "good"; save(); render();
  } else { c.msel = null; miss("That label slides right off. That organelle does a different job."); }
}
function dropItem(id, tid){
  const q = curQ(), c = S.cur; if(isSolved()) return;
  const kind = id[0], idx = +id.slice(1);
  c.sel = null;
  if(q.type === "label" && kind === "L"){
    const pin = q.pins.find(p => p.pin === tid); if(!pin || c.placed[tid] != null) return;
    if(pin.ans === idx){ c.placed[tid] = idx; sfx("drop"); sparkle(); if(Object.keys(c.placed).length === q.pins.length){ solve(); return; } c.msg = `Yes! ${q.labels[idx]} goes on pin ${tid}.`; c.msgType = "good"; save(); render(); }
    else miss(`${q.labels[idx]} doesn’t belong on pin ${tid}.`, {bounce:id});
  } else if(q.type === "order" && kind === "O"){
    if(idx === c.pos){ c.pos++; sfx("drop"); sparkle(); if(c.pos === q.steps.length){ solve(); return; } c.msg = "That’s the next step!"; c.msgType = "good"; save(); render(); }
    else miss("That step doesn’t come next. Think about where this process starts.", {bounce:id});
  } else if(q.type === "sort" && kind === "T"){
    if(c.placed[idx] != null) return;
    if(q.tiles[idx].bin === tid){ c.placed[idx] = tid; sfx("drop"); sparkle(); if(Object.keys(c.placed).length === q.tiles.length){ solve(); return; } c.msg = "Into the bin it goes!"; c.msgType = "good"; save(); render(); }
    else miss("That cell doesn’t belong in that bin. Think about what it spends its day doing.", {bounce:id});
  }
}
function letter(i){
  const q = curQ(), c = S.cur; if(isSolved() || c.picked.includes(i) || c.picked.length >= q.word.length) return;
  c.picked.push(i); sfx("letter");
  if(c.picked.length === q.word.length){
    const w = c.picked.map(k => q.scr[k]).join("");
    if(w === q.word){ solve(); return; }
    c.picked = []; c.bad = true; miss(`“${w}” isn’t it. The letters scatter back. Try again!`); return;
  }
  render();
}
function ccheck(){
  const q = curQ(), c = S.cur; if(c.csel.length !== 3) return;
  const gi = q.groups.findIndex(g => c.csel.every(t => g.items.includes(t)));
  if(gi >= 0){ c.found.push(gi); c.csel = []; sfx("chime"); sparkle(); if(c.found.length === q.groups.length){ solve(); return; } c.msg = `Group found: ${q.groups[gi].name}!`; c.msgType = "good"; save(); render(); }
  else { const best = Math.max(...q.groups.map(g => c.csel.filter(t => g.items.includes(t)).length)); c.csel = []; miss(best === 2 ? "So close! You were one away." : "Those three don’t share a job. Try again."); }
}
function fmAnswer(i, v){
  const q = curQ(), c = S.cur; if(isSolved() || c.fm[i]) return;
  if(q.items[i].fact === v){ c.fm[i] = true; sfx("tick"); sparkle(); if(Object.keys(c.fm).length === q.items.length){ solve(); return; } c.msg = "Correct!"; c.msgType = "good"; save(); render(); }
  else miss(v ? "Myth! That one sounds true, but it isn’t." : "Actually, that one’s a fact!", {row:i});
}
function btest(){
  const q = curQ(), c = S.cur;
  const wrong = q.rows.map((r,i) => c.build[i] === r.ans ? -1 : i).filter(i => i >= 0);
  if(!wrong.length){ c.wrongRows = []; solve(); return; }
  c.wrongRows = wrong; miss(`Your cell didn’t pass the test. ${wrong.length} setting${wrong.length > 1 ? "s need" : " needs"} rethinking.`);
}
function startGame(caseId){
  const name = (S.nameDraft || "").trim().replace(/\s+/g, " ");
  if(!/^\S+ \S+/.test(name)){ S.warn = "Please type your first and last name. It goes on your escape poster so your teacher knows it’s yours."; focusSel = "#nm"; return; }
  S.name = name; S.caseId = caseId; S.started = Date.now(); S.attempt = (S.attempt || 0) + 1;
  S.seed = (Date.now() ^ Math.floor(Math.random()*1e9)) >>> 0;
  GAME = buildGame(S.seed, caseId);
  S.screen = "hall"; S.warn = false; window.scrollTo(0,0); sfx("bell"); sfx("door", 900); syncExt();
  setTimeout(() => bonesSay(`Welcome to the night shift, ${firstName()}! Try each challenge on your own first.`), 700);
}
function doHint(){
  if(S.screen !== "room" || isSolved()){ bonesSay(pick(S.screen === "hall" ? ["Pick a door, any door. Well, any unlocked door.","I hear there’s a pumpkin hiding around here somewhere…","Did you see that ghost? Click it if it comes back!"] : QUIPS_HAPPY)); return; }
  if(!S.intro[S.room]){ bonesSay("Step inside first, then I’ll help!"); return; }
  if(S.cur.hint){ bonesSay("Your hint is waiting in the challenge card."); return; }
  S.cur.ask = true; sfx("rattle"); focusSel = '[data-act="hintyes"]'; save(); render();
  bonesSay("Hints count toward your level. Check the card to decide.");
}
function useHint(){
  const c = S.cur; if(c.hint) return;
  c.hint = true; c.ask = false; S.hints++; award("bones"); sfx("hint");
  focusSel = ".hint"; save(); render();
  bonesSay("I left you a hint in the challenge card. Take a look!", "happy");
}

function act(a, d){
  const c = S.cur;
  switch(a){
    case "scope": c.scope = !c.scope; focusSel = '[data-act="scope"]'; break;
    case "avatar": S.avatar = +d.i; focusSel = `[data-act="avatar"][data-i="${d.i}"]`; break;
    case "pickcase": S.pendingCase = d.case; S.warn = false; focusSel = `[data-case="${d.case}"]`; break;
    case "start": if(!S.pendingCase){ S.warn = "Pick a patient first, or let the hospital surprise you."; break; } startGame(S.pendingCase); break;
    case "surprise": startGame(pick(CASES).id); break;
    case "continue": S.screen = S.finished ? "poster" : "hall"; break;
    case "totitle": S.overlay = null; S.screen = "title"; break;
    case "restart": {
      if(!window.confirm("Start completely over? This erases your current progress, points, and badges on this device. Your past escapes stay saved.")) return;
      S = fresh(keepOf(S)); GAME = null; shownPts = 0; titleShown = false; break;
    }
    case "again": S = fresh(keepOf(S)); GAME = null; shownPts = 0; titleShown = false; window.scrollTo(0,0); break;
    case "enter": enterRoom(+d.room); break;
    case "begin": sfx(["vault","bubble","drawer","heartbeat"][S.room]); S.intro[S.room] = true; setView(S.prog[S.room] < nQ(S.room) ? S.prog[S.room] : 0); setTimeout(() => bonesSay(pick(QUIPS_IDLE)), 500); break;
    case "reviewroom": S.screen = "room"; setView(0); break;
    case "goto": setView(+d.i); break;
    case "prev": if(S.view > 0) setView(S.view - 1); break;
    case "next": next(); return;
    case "choose": choose(+d.i); return;
    case "msel": matchClick("L", +d.i); return;
    case "mpick": matchClick("R", +d.i); return;
    case "letter": letter(+d.i); return;
    case "unletter": c.picked.pop(); break;
    case "clearletters": c.picked = []; break;
    case "ctile": { const t = d.t; if(c.csel.includes(t)) c.csel = c.csel.filter(x => x !== t); else if(c.csel.length < 3) c.csel.push(t); sfx("click"); break; }
    case "ccheck": ccheck(); return;
    case "cclear": c.csel = []; break;
    case "fm": fmAnswer(+d.i, d.v === "1"); return;
    case "bset": c.build[+d.i] = +d.j; c.wrongRows = c.wrongRows.filter(x => x !== +d.i); sfx("click"); break;
    case "btest": btest(); return;
    case "hint": doHint(); return;
    case "hintyes": useHint(); return;
    case "hintno": c.ask = false; bonesSay("That’s the spirit. You’ve got this!", "happy"); break;
    case "hall": S.overlay = null; S.screen = "hall"; S.cur = freshCur(); window.scrollTo(0,0); break;
    case "poster": S.overlay = null; S.screen = "poster"; window.scrollTo(0,0); break;
    case "case": S.overlay = "case"; sheetPop = true; focusSel = '[data-act="close"]'; break;
    case "menu": S.overlay = "menu"; sheetPop = true; focusSel = '[data-act="close"]'; break;
    case "badges": S.overlay = "badges"; sheetPop = true; focusSel = '[data-act="close"]'; break;
    case "backup": S.overlay = "backup"; sheetPop = true; break;
    case "close": closeOverlay(); break;
    case "mitosis": mitoBack = d.from === "peek" ? "[data-peek]" : '[data-act="mitosis"]'; S.overlay = "mitosis"; sheetPop = true; focusSel = '[data-act="close"]'; break;
    case "mitoplay": {
      const m = document.querySelector(".mito"), b = document.querySelector('[data-act="mitoplay"]'); if(!m || !b) return;
      const paused = m.classList.toggle("paused");
      b.innerHTML = paused ? `${ic("play")} Play` : `${ic("pause")} Pause`;
      return;
    }
    case "sound": PREFS.sound = !PREFS.sound; savePrefs(); if(PREFS.sound){ sfx("toggle"); if(PREFS.amb) startAmb(); } else stopAmb(); break;
    case "setpref": {
      const k = d.k, v = d.v;
      if(k === "sound" || k === "amb" || k === "ext") PREFS[k] = v === "1"; else PREFS[k] = v;
      savePrefs(); applyPrefs(); syncExt();
      if(PREFS.sound && PREFS.amb) startAmb(); else stopAmb();
      if(k === "sound" && PREFS.sound) sfx("toggle");
      focusSel = `[data-k="${k}"][data-v="${v}"]`; break;
    }
    case "settings": S.overlay = "settings"; sheetPop = true; focusSel = '[data-act="close"]'; break;
    case "pumpkin": {
      const p = d.p; if(S.pumpkins.includes(p)) return;

      toast("pumpkin", `Hidden pumpkin found! (${S.pumpkins.length}/${PUMPKINS.length})`, "+50 Mustang points");
      if(S.pumpkins.length === PUMPKINS.length) award("pumpkin");
      break;
    }
    case "ghost": {
      const g = document.querySelector(".ghost"); if(g) g.classList.add("boo");
      sfx("ghost"); bonesSay("BOO! Ha, even I jumped.", "happy");
      if(!S.badges.includes("ghost")){ addPoints(25); award("ghost"); }
      save(); setTimeout(render, 650); return;
    }
    case "copycode": {
      const ta = document.getElementById("bk-out"), msg = document.getElementById("copymsg");
      ta.select();
      const done = ok => { msg.textContent = ok ? "Copied!" : "Press Ctrl+C (or Cmd+C) to copy the highlighted code."; };
      try{ navigator.clipboard.writeText(ta.value).then(() => done(true), () => { try{ done(document.execCommand("copy")); }catch(e){ done(false); } }); }
      catch(e){ try{ done(document.execCommand("copy")); }catch(e2){ done(false); } }
      return;
    }
    case "loadcode": {
      const msg = document.getElementById("loadmsg"), raw = (document.getElementById("bk-in").value || "").trim();
      try{
        const j = JSON.parse(decodeURIComponent(escape(atob(raw))));
        if(!j || !Array.isArray(j.prog) || !CASE_BY[j.caseId] || !j.seed) throw new Error("bad");
        if(!window.confirm("Load this backup? It replaces the progress currently on this device.")) return;
        S = Object.assign(fresh(), j); S.cur = freshCur(); S.overlay = null;
        GAME = buildGame(S.seed, S.caseId); S.screen = S.finished ? "poster" : "hall"; shownPts = S.points;
        toast("save", "Backup loaded", `Welcome back, ${S.name}!`);
      }catch(e){ msg.textContent = "That code didn’t work. Make sure you copied the whole thing."; return; }
      break;
    }
    default: return;
  }
  save(); render();
}

function dragUpdate(){
  if(!drag || !drag.ghost) return;

  drag.ghost.style.display = "none"; const under = document.elementFromPoint(drag.cx, drag.cy); drag.ghost.style.display = "";
  const tgt = under && under.closest("[data-drop]");
  if(drag.over && drag.over !== tgt) drag.over.classList.remove("over");
  if(tgt) tgt.classList.add("over");

}
function edgeScroll(){

  const edge = 80, h = window.innerHeight; let dy = 0;
  if(drag.cy > h - edge) dy = Math.ceil((drag.cy - (h - edge)) / 5);

}
function endDrag(e, cancel){

  if(!d.ghost) return;
  d.ghost.remove(); d.el.classList.remove("lifting"); if(d.over) d.over.classList.remove("over");
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if(e) lastPt = {x:e.clientX, y:e.clientY};
  if(!cancel && d.over) dropItem(d.id, d.over.getAttribute("data-drop"));
  else if(!cancel){ S.cur.sel = null; render(); }
}
document.addEventListener("pointerup", e => endDrag(e, false));
document.addEventListener("pointercancel", () => endDrag(null, true));

app.addEventListener("click", e => {
  if(suppressClick) return;
  if(e.target.matches && e.target.matches("[data-overlay]")){ closeOverlay(); render(); return; }
  const orgEl = e.target.closest(".cell.tappable [data-org]");
  if(orgEl){ tapOrg(orgEl.getAttribute("data-org")); return; }
  if(e.target.closest(".cell:not(.tappable) [data-peek]")){ act("mitosis", {from:"peek"}); return; }
  const dropEl = e.target.closest("[data-drop]");
  if(dropEl && S.cur.sel != null){ dropItem(S.cur.sel, dropEl.getAttribute("data-drop")); return; }
  const dragEl = e.target.closest("[data-drag]");
  if(dragEl){ const id = dragEl.getAttribute("data-drag"); S.cur.sel = S.cur.sel === id ? null : id; if(S.cur.sel) sfx("pick"); render(); const again = app.querySelector(`[data-drag="${id}"]`); if(again) again.focus(); return; }
  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  act(b.dataset.act, b.dataset);
});
app.addEventListener("input", e => { if(e.target.id === "nm"){ S.nameDraft = e.target.value; if(S.warn){ S.warn = false; } save(); } });
app.addEventListener("keydown", e => {
  const t = e.target;
  if((e.key === "Enter" || e.key === " ") && t.matches && t.matches(".cell.tappable [data-org]")){ e.preventDefault(); tapOrg(t.getAttribute("data-org")); }
  else if((e.key === "Enter" || e.key === " ") && t.matches && t.matches(".cell:not(.tappable) [data-peek]")){ e.preventDefault(); act("mitosis", {from:"peek"}); }
  else if((e.key === "Enter" || e.key === " ") && t.matches && t.matches("[data-drop]") && S.cur.sel != null){ e.preventDefault(); dropItem(S.cur.sel, t.getAttribute("data-drop")); }
  else if(e.key === "Enter" && t.id === "nm"){ e.preventDefault(); const c = document.querySelector(".case"); if(c) c.focus(); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && S.overlay){ closeOverlay(); render(); return; }
  if(S.screen === "room" && !S.overlay && GAME && !isSolved() && curQ() && curQ().type === "unscramble" && !(e.target.matches && e.target.matches("input,textarea"))){
    const q = curQ(), c = S.cur;
    if(e.key === "Backspace"){ c.picked.pop(); render(); e.preventDefault(); return; }
    const k = e.key.toUpperCase();
    if(/^[A-Z]$/.test(k)){ const i = [...q.scr].findIndex((ch,j) => ch === k && !c.picked.includes(j)); if(i >= 0){ e.preventDefault(); letter(i); } }
  }
});
document.getElementById("bonesBtn").addEventListener("click", () => { if(!(S.screen === "room" && !isSolved())) sfx("rattle"); doHint(); });
document.getElementById("spider").addEventListener("click", e => {
  const sp = document.getElementById("spider"); lastPt = {x:e.clientX, y:e.clientY};
  sp.classList.add("flee"); sfx("skitter");
  if(!S.badges.includes("spider") && S.started){ addPoints(25); award("spider"); save(); animatePts(); }
  setTimeout(() => sp.classList.remove("flee"), 40000);
});

render();
})();
</script>
</body>
</html>
